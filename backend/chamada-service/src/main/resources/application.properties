spring.application.name=chamada-service
server.port=${PORT:8082}

# Conexão Azure SQL Database (banco do chamada-service)
spring.datasource.url=${AZURE_SQL_URL}
spring.datasource.username=${AZURE_SQL_USERNAME}
spring.datasource.password=${AZURE_SQL_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=5

# 2.5 - O esquema do banco é controlado SOMENTE pelo Flyway (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# 2.8 - SQL no log desligado (custo de log/desempenho)
spring.jpa.show-sql=false

# Banco que já existia (tabelas criadas pelo antigo ddl-auto=update): o Flyway marca a V1 como aplicada
# e executa só as migrações novas. Banco vazio: executa todas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Segurança: mesmo segredo do API Gateway
jwt.secret=${JWT_SECRET}

# turma-service (turma existe? professor é dono? quais alunos estão matriculados?)
services.turma.url=${TURMA_SERVICE_URL:http://localhost:8083}

# Azure Service Bus (publicação via Outbox). Para rodar localmente sem Service Bus: AZURE_SERVICEBUS_ENABLED=false
azure.servicebus.enabled=${AZURE_SERVICEBUS_ENABLED:true}
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.topic-name=${AZURE_SERVICEBUS_TOPIC:chamadas-topic}
outbox.intervalo-ms=5000

logging.level.com.sistema=INFO

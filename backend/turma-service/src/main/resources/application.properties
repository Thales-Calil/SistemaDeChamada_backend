spring.application.name=turma-service
server.port=8083

# Conexão Azure SQL Database
spring.datasource.url=jdbc:sqlserver://<seu-servidor>.database.windows.net:1433;database=<seu-banco>;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=<seu-usuario>
spring.datasource.password=<sua-senha>
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
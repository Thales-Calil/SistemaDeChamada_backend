spring.application.name=aluno-service
server.port=${PORT:8081}

# Azure DocumentDB / Cosmos DB (API para MongoDB).
# A variável SPRING_DATA_MONGODB_URI recebe a connection string (mongodb+srv://... ou mongodb://...).
# Sem valor padrão: se faltar, o serviço não sobe.
# Spring Boot 4 usa spring.mongodb.*; as linhas spring.data.mongodb.* são mantidas por compatibilidade.
spring.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:chamadas_alunos}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:chamadas_alunos}

# Segurança: mesmo segredo do API Gateway
jwt.secret=${JWT_SECRET}

# turma-service (matrículas: filtro do professor e integridade na exclusão)
services.turma.url=${TURMA_SERVICE_URL:http://localhost:8083}

# Azure Service Bus (consumer). Para rodar localmente sem Service Bus: AZURE_SERVICEBUS_ENABLED=false
azure.servicebus.enabled=${AZURE_SERVICEBUS_ENABLED:true}
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.topic-name=${AZURE_SERVICEBUS_TOPIC:chamadas-topic}
azure.servicebus.subscription-name=${AZURE_SERVICEBUS_SUBSCRIPTION:aluno-service-sub}

logging.level.com.sistema=INFO
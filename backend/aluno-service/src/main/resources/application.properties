spring.application.name=aluno-service

server.port=8081

# Configuração de Conexão com o MongoDB Atlas
# Substitua <usuario>, <senha> e <cluster> pelos seus dados reais do MongoDB Atlas
spring.data.mongodb.uri=mongodb+srv://<usuario>:<senha>@<cluster>.mongodb.net/alunos_db?retryWrites=true&w=majority

# Configurações do Azure Service Bus Consumer
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:Endpoint=sb://mock.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=mockKey}
azure.servicebus.topic-name=${AZURE_SERVICEBUS_TOPIC:chamadas-topic}
azure.servicebus.subscription-name=${AZURE_SERVICEBUS_SUBSCRIPTION:aluno-service-sub}